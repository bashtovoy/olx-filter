<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OLX Фільтр</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <header class="head">
      <div class="brand">
        <span class="logo" aria-hidden="true">O</span>
        <div>
          <div class="name" data-i18n="title">OLX Фільтр</div>
          <div class="sub" data-i18n="subtitle">Чиста видача без зайвого</div>
        </div>
      </div>
      <span class="version">0.2.1</span>
    </header>

    <div class="status" id="status" data-tone="muted" aria-live="polite">
      <span class="status-dot" aria-hidden="true"></span>
      <span id="statusText" data-i18n="loading">Перевіряємо вкладку…</span>
    </div>

    <main>
      <section class="block">
        <div class="block-head">
          <h2 data-i18n="display">Відображення</h2>
          <span class="badge" id="cleanBadge" data-i18n="cleanBadge">чиста видача</span>
        </div>
        <div class="toggle-grid">
          <label class="toggle">
            <input id="hideTop" type="checkbox" checked>
            <span class="switch" aria-hidden="true"></span>
            <span data-i18n="hideTop">Приховувати ТОП</span>
          </label>
          <label class="toggle">
            <input id="hidePromoted" type="checkbox">
            <span class="switch" aria-hidden="true"></span>
            <span data-i18n="hidePromoted">Приховувати рекламу</span>
          </label>
          <label class="toggle">
            <input id="hideBarter" type="checkbox">
            <span class="switch" aria-hidden="true"></span>
            <span data-i18n="hideBarter">Приховувати «Обмін»</span>
          </label>
          <label class="toggle">
            <input id="cleanResults" type="checkbox" checked>
            <span class="switch" aria-hidden="true"></span>
            <span data-i18n="cleanResults">Чиста видача</span>
          </label>
        </div>
        <p class="hint" data-i18n="cleanHint">Прибирає рекламні блоки, «Зберегти пошук» і SEO-блоки.</p>
      </section>

      <section class="block">
        <h2 data-i18n="filters">Фільтри</h2>
        <div class="row two">
          <label class="field">
            <span data-i18n="sort">Сортування</span>
            <select id="sort">
              <option value="filter_float_price:asc" data-i18n="sortCheapest">Спочатку дешеві</option>
              <option value="filter_float_price:desc" data-i18n="sortExpensive">Спочатку дорогі</option>
              <option value="created_at:desc" data-i18n="sortNewest">Спочатку нові</option>
              <option value="relevance:desc" data-i18n="sortRelevance">Рекомендовані</option>
              <option value="" data-i18n="sortNone">Не змінювати</option>
            </select>
          </label>
          <label class="field">
            <span data-i18n="view">Вигляд</span>
            <select id="view">
              <option value="grid" data-i18n="viewGrid">Плитка</option>
              <option value="list" data-i18n="viewList">Список</option>
            </select>
          </label>
        </div>

        <div class="price-row">
          <span class="field-label" data-i18n="price">Ціна</span>
          <span class="currency" id="currency">грн.</span>
          <input id="priceFrom" type="text" inputmode="numeric" autocomplete="off"
                 data-i18n-placeholder="from" placeholder="від" aria-label="Ціна від">
          <span class="dash" aria-hidden="true">—</span>
          <input id="priceTo" type="text" inputmode="numeric" autocomplete="off"
                 data-i18n-placeholder="to" placeholder="до" aria-label="Ціна до">
        </div>

        <div class="condition-row">
          <span class="field-label" data-i18n="condition">Стан</span>
          <div class="chips">
            <button type="button" class="chip" id="conditionNew" aria-pressed="true"
                    data-i18n="conditionNew">Нове</button>
            <button type="button" class="chip" id="conditionUsed" aria-pressed="true"
                    data-i18n="conditionUsed">Вживане</button>
          </div>
        </div>

        <label class="auto">
          <input id="autoApply" type="checkbox" checked>
          <span data-i18n="auto">Застосовувати автоматично</span>
        </label>
      </section>

      <div class="notice" id="notice" hidden></div>
      <div class="error" id="error" hidden></div>
    </main>

    <footer class="actions">
      <button type="button" class="secondary" id="reset" data-i18n="reset">Скинути фільтри</button>
      <button type="button" class="primary" id="apply" data-i18n="apply">Застосувати</button>
    </footer>
    <p class="footnote" data-i18n="note">Сортування, ціна та вигляд застосовуються до активної вкладки OLX.</p>
  </div>

  <script src="common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
